dataset:
  data_path: '$ALFWORLD_DATA/json_2.1.1/train'
  eval_id_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_seen'
  eval_ood_data_path: '$ALFWORLD_DATA/json_2.1.1/valid_unseen'
  num_train_games: -1
  num_eval_games: -1
logic:
  domain: '$ALFWORLD_DATA/logic/alfred.pddl'
  grammar: '$ALFWORLD_DATA/logic/alfred.twl2'
env:
  type: 'AlfredTWEnv'
  regen_game_files: False
  domain_randomization: False
  task_types: [1, 2, 3, 4, 5, 6]
  expert_timeout_steps: 150
  expert_type: "handcoded"
  goal_desc_human_anns_prob: 0.0
  hybrid:
    start_eps: 100000
    thor_prob: 0.5
    eval_mode: "tw"
  thor:
    screen_width: 300
    screen_height: 300
    smooth_nav: False
    save_frames_to_disk: False
    save_frames_path: './videos/'
controller:
  type: 'oracle'
  debug: False
  load_receps: True
mask_rcnn:
  pretrained_model_path: '$ALFWORLD_DATA/detectors/mrcnn.pth'
general:
  random_seed: 42
  use_cuda: True
  visdom: False
  task: 'alfred'
  # 'dqn' reads rl.training.max_nb_steps_per_episode and skips the AlfredExpert
  # wrapper; we act with the LLM, never the oracle planner.
  training_method: 'dqn'
  save_path: './training/'
  observation_pool_capacity: 3
  hide_init_receptacles: False
  training:
    batch_size: 1
    max_episode: 50000
    smoothing_eps: 0.1
    optimizer:
      learning_rate: 0.001
      clip_grad_norm: 5
  evaluate:
    run_eval: True
    batch_size: 1
    env:
      type: "AlfredTWEnv"
  checkpoint:
    report_frequency: 1000
    experiment_tag: 'test'
    load_pretrained: False
    load_from_tag: 'not loading anything'
  model:
    encoder_layers: 1
    decoder_layers: 1
    encoder_conv_num: 5
    block_hidden_dim: 64
    n_heads: 1
    dropout: 0.1
    block_dropout: 0.1
    recurrent: True
rl:
  action_space: "admissible"
  max_target_length: 20
  beam_width: 10
  generate_top_k: 3
  training:
    max_nb_steps_per_episode: 50
