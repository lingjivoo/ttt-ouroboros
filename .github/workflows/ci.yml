name: ci
on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - run: make compile
      - run: make test
      - run: make lint
      - name: Validate manifests
        env:
          TTT_CKPT: /artifacts/checkpoints
          TTT_DATA: /artifacts/data
          TTT_OUT: /tmp/ttt-results
        run: make suite-dry-run
      - run: python scripts/source_manifest.py --check
