[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttt-write-authority"
version = "0.1.0"
description = "Reproducible experiments for persistent test-time updates in self-generated streams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anonymous Authors"}]
dependencies = [
  "numpy>=2.0",
  "einops>=0.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
language = [
  "torch>=2.5",
  "transformers>=4.45",
  "accelerate>=1.0",
  "datasets>=3.0",
  "sentencepiece>=0.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
]
agents = [
  "peft>=0.13",
  "alfworld==0.4.2",
  "fast-downward-textworld",
  "scienceworld==1.2.3",
]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["ttt_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
