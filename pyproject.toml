[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttt-ouroboros"
version = "0.1.0"
description = "TTT Ouroboros: causal experiments on self-generated feedback in test-time training"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cheng Luo"}, {name = "Bing Li"}, {name = "Bernard Ghanem"}]
dependencies = [
  "numpy>=2.0,<3",
  "einops>=0.8,<1",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
language = [
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "sentencepiece>=0.2,<1",
  "scipy>=1.13,<2",
  "matplotlib>=3.9,<4",
  "reportlab>=4.2,<5",
]
agents = [
  "peft>=0.13,<1",
  "rank-bm25>=0.2.2,<1",
  "beautifulsoup4>=4.12,<5",
  "flask>=3.0,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["ttt_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts", "analysis", "figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
