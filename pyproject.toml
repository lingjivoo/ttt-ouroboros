[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttt-write-authority"
version = "0.1.0"
description = "Reproduction code for long-horizon self-generated feedback in test-time training"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Anonymous Authors"}]
dependencies = [
  "numpy>=2.0",
  "einops>=0.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
language = [
  "torch>=2.5",
  "transformers>=4.45",
  "accelerate>=1.0",
  "datasets>=3.0",
  "sentencepiece>=0.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
]
agents = [
  "peft>=0.13",
  "rank-bm25>=0.2.2",
  "beautifulsoup4>=4.12",
  "flask>=3.0",
  "reportlab>=4.2",
]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["ttt_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
